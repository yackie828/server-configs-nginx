# ----------------------------------------------------------------------
# | Reverse Proxy Configuration for Node.js Application               |
# ----------------------------------------------------------------------
#
# This configuration sets up Nginx as a reverse proxy for a Node.js
# application running on localhost:3000

# Upstream definition for Node.js application
upstream nodejs_backend {
  server 127.0.0.1:3000;
  keepalive 64;
}

server {
  listen [::]:80;
  listen 80;

  # Server name - change this to your domain or use localhost for development
  server_name localhost;

  # Increase the size limit for uploads if needed
  client_max_body_size 100M;

  # Logging
  access_log /var/log/nginx/nodejs_app_access.log main;
  error_log /var/log/nginx/nodejs_app_error.log warn;

  # Security headers
  add_header X-Frame-Options $x_frame_options always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy $referrer_policy always;
  add_header Content-Security-Policy $content_security_policy always;

  # Proxy settings for Node.js application
  location / {
    proxy_pass http://nodejs_backend;
    proxy_http_version 1.1;
    
    # WebSocket support
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_cache_bypass $http_upgrade;
    
    # Forward real client IP
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Port $server_port;
    
    # Timeouts
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;
  }

  # Include the basic h5bp config set
  include h5bp/basic.conf;
}
