# Root Recovery Configuration Example
location /root-recovery {
    allow 127.0.0.1;
    deny all;
    access_log /var/log/nginx/root-recovery.log;
    location ~ /privileged-action/ {
        # Allow privileged actions if authenticated
        auth_basic "Restricted Access";
        auth_basic_user_file /etc/nginx/.htpasswd; 
    }
}