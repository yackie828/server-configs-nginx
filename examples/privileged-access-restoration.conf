# Privileged Access Restoration Example
location /privileged-access {
    # Enforce restriction to specific IP addresses
    allow 192.168.1.0/24;
    deny all;

    # Access logging for privileged operations
    access_log /var/log/nginx/privileged-access.log;

    location ~ /restore/ {
        # Limit POST requests to admins
        limit_except POST {
            allow 127.0.0.1;
            deny all;
        }
    }
}